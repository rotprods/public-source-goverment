[workspace]
resolver = "3"
members = [
  "crates/domain",
  "services/api"
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/rotprods/public-source-goverment"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "cors"] }
uuid = { version = "1", features = ["v7", "serde"] }
