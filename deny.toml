[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
private = { ignore = true }
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0"
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
