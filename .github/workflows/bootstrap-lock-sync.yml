name: bootstrap-lock-sync

on:
  push:
    branches:
      - bootstrap/empezarproyecto-v1

permissions:
  contents: write

concurrency:
  group: bootstrap-lock-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-cargo-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Resolve workspace lockfile without changing manifests
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit only Cargo.lock when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "civic-bootstrap-bot"
          git config user.email "civic-bootstrap-bot@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: synchronize Cargo lockfile for civic-policy"
          git push origin HEAD:${GITHUB_REF_NAME}
