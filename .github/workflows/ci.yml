name: ci

on:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Verify Rust lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Verify pnpm lockfile
        run: pnpm install --lockfile-only --frozen-lockfile

  contracts:
    name: Contract and truth sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-contracts.mjs

  rust:
    name: Rust compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --release

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @civic/web build

  security:
    name: Supply chain and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: cargo audit
      - run: cargo deny check
      - run: pnpm install --lockfile-only --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build PostgreSQL/PostGIS/pgvector dev image
        run: docker build -f infra/docker/postgres/Dockerfile -t civic-postgres:ci .
      - name: Build Rust API image
        run: docker build -f infra/docker/api/Dockerfile -t civic-api:ci .
